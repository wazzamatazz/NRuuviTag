name: Publish Artifacts

on:
  release: 
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-artifacts:
    name: Publish
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      CONTAINER_REGISTRY: ghcr.io
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
      - name: GHCR Login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Solution
        run: ./build.sh --target PrepareRelease --container-registry ${{ env.CONTAINER_REGISTRY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: NuGet Login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: NuGet Push
        run: dotnet nuget push --source https://api.nuget.org/v3/index.json --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} ./artifacts/packages/Release/*.nupkg
      - name: Upload Artifacts
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
            shopt -s nullglob
            assets=()
            
            bom="artifacts/bom/Release/bom.json"
            if [ -f "$bom" ]; then
              assets+=("$bom")
            fi
            
            for dir in artifacts/publish/Release/NRuuviTag.Cli/*/; do
              name=$(basename "$dir")
              zip -r "$name.zip" "$dir"
              assets+=("$name.zip")
            done
            
            if [ ${#assets[@]} -eq 0 ]; then
              echo "No assets to upload" >&2
              exit 1
            fi
            
            gh release upload "${{ github.ref_name }}" "${assets[@]}" --clobber
