name: Create Release

on: [workflow_dispatch]

permissions:
  contents: read
  packages: write
  id-token: write
  
concurrency:
  group: ${{ github.workflow }} @ ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      CONTAINER_REGISTRY: ghcr.io
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: GHCR Login
        uses: docker/login-action@v4
          with:
            registry: ${{ env.CONTAINER_REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Solution
        run: ./build.sh --target PrepareRelease --container-registry ${{ env.CONTAINER_REGISTRY }} --container-username ${{ github.actor }} --container-password ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: NuGet Login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: NuGet Push
        run: dotnet nuget push --source https://api.nuget.org/v3/index.json --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} ./artifacts/packages/Release/*.nupkg
