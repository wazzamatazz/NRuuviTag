name: Continuous Integration

on: 
  pull_request: 
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  
concurrency: 
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true
  
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Build Solution
        run: ./build.sh --target Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
